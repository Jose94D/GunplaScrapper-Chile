{% extends "public/base.html" %}

{% block title %}Admin Login{% endblock %}

{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<style>
    .container { max-width: 400px; margin-top: 100px; }
</style>
{% endblock %}

{% block content %}
<h2 class="text-center">Acceso Administrador</h2>

{% if error %}
    <p class="admin-login-error">{{ error }}</p>
{% endif %}

<form method="POST" class="login-form">
    <input type="text" name="username" class="search-input full-width" placeholder="Usuario" required autocomplete="username">
    <input type="password" name="password" class="search-input full-width" placeholder="Contraseña" required autocomplete="current-password">
    <button type="submit" class="btn full-width">Ingresar</button>
</form>

<div class="text-center mt-20">
    <a href="/">⬅ Volver al inicio</a>
</div>
{% endblock %}
