<section id="cuenta" class="panel seccion-panel">
    <h2>Cuenta</h2>
    <p class="texto-tenue small">Cambia el usuario y la contraseña del panel. Se guardan en la base (la contraseña como hash) y reemplazan a las del <code>.env</code>.</p>
    <form action="/admin/credenciales/actualizar" method="POST" class="cuenta-form">
        {{ campo_csrf() }}
        <div>
            <label for="nuevo_usuario" class="form-label small texto-suave">Nuevo usuario</label>
            <input type="text" id="nuevo_usuario" name="nuevo_usuario" class="form-control campo" required autocomplete="username">
        </div>
        <div>
            <label for="nueva_password" class="form-label small texto-suave">Nueva contraseña</label>
            <input type="password" id="nueva_password" name="nueva_password" class="form-control campo" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn boton-acento">Actualizar accesos</button>
    </form>
</section>
