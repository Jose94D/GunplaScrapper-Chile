<section id="eventos" class="panel seccion-panel">
    <h2>Eventos recientes</h2>
    <ol class="eventos">
        {% for fecha_evento, accion in lista_logs %}
        <li><span class="mono">{{ fecha_evento|fecha }}</span><span>{{ accion }}</span></li>
        {% else %}
        <li class="texto-tenue">No hay eventos registrados.</li>
        {% endfor %}
    </ol>
</section>
