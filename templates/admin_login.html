{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block page_styles %}
<style>
    .container { max-width: 400px; margin-top: 100px; }
</style>
{% endblock %}

{% block content %}
<h2 style="text-align: center;">Acceso Administrador</h2>

{% if error %}
    <p style="color: #ef4444; text-align: center;">{{ error }}</p>
{% endif %}

<form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
    <input type="text" name="username" class="search-input" placeholder="Usuario" required style="width: 100%; max-width: none; box-sizing: border-box;">
    <input type="password" name="password" class="search-input" placeholder="Contraseña" required style="width: 100%; max-width: none; box-sizing: border-box;">
    <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
</form>

<div style="text-align: center; margin-top: 20px;"><a href="/">⬅ Volver al inicio</a></div>
{% endblock %}
